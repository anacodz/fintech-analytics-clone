<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fi Money Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 24px; }
        .card-header { background-color: white; border-bottom: 1px solid #edf2f7; font-weight: 600; padding: 16px 20px; border-top-left-radius: 12px !important; border-top-right-radius: 12px !important;}
        .navbar { background-color: #1a202c; }
        .navbar-brand { color: white !important; font-weight: bold; }
        .chart-container { position: relative; height: 350px; width: 100%; padding: 20px; }
        .metric-value { font-size: 2rem; font-weight: 700; color: #2d3748; }
        .metric-label { font-size: 0.875rem; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#">💰 Fi Money Clone Analytics</a>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <!-- Daily Active Users -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">Daily Active Users (DAU)</div>
                <div class="card-body chart-container">
                    <canvas id="dauChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Revenue Trend -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">Cumulative Revenue Trend</div>
                <div class="card-body chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Retention Cohort -->
        <div class="col-12">
            <div class="card">
                <div class="card-header">User Retention (Month-over-Month Activity)</div>
                <div class="card-body chart-container">
                    <canvas id="retentionChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration for Charts
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = '#718096';

    // 1. Load and process DAU Data
    Papa.parse("dau_data.csv", {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => row.date && row.dau);
            const dates = data.map(row => row.date);
            const dau = data.map(row => parseInt(row.dau));

            new Chart(document.getElementById('dauChart'), {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Active Users',
                        data: dau,
                        borderColor: '#4299e1',
                        backgroundColor: 'rgba(66, 153, 225, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#edf2f7' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    });

    // 2. Load and process Revenue Data
    Papa.parse("revenue_trend_data.csv", {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => row.date && row.cumulative_revenue);
            const dates = data.map(row => row.date);
            const cumulative = data.map(row => parseFloat(row.cumulative_revenue));

            new Chart(document.getElementById('revenueChart'), {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Cumulative Revenue ($)',
                        data: cumulative,
                        borderColor: '#48bb78',
                        backgroundColor: 'rgba(72, 187, 120, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#edf2f7' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    });

    // 3. Load and process Retention Data
    Papa.parse("retention_cohort_data.csv", {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => row.cohort_month && row.month_number && row.active_users);
            
            // Group by cohort
            const cohorts = {};
            data.forEach(row => {
                if (!cohorts[row.cohort_month]) cohorts[row.cohort_month] = [];
                cohorts[row.cohort_month].push({
                    month: parseInt(row.month_number),
                    users: parseInt(row.active_users)
                });
            });

            // Create datasets for a few major cohorts
            const colors = ['#f56565', '#ed8936', '#ecc94b', '#48bb78', '#38b2ac', '#4299e1', '#9f7aea', '#ed64a6'];
            const datasets = [];
            let colorIdx = 0;
            
            // Just take the first 6 cohorts to avoid clutter
            const selectedCohorts = Object.keys(cohorts).sort().slice(0, 6);

            selectedCohorts.forEach(cohortMonth => {
                const monthData = cohorts[cohortMonth].sort((a,b) => a.month - b.month);
                // Get month 0 users to calculate percentage
                const initialUsers = monthData.find(d => d.month === 0)?.users || 1;
                
                // For a retention chart, usually we plot month 0, 1, 2, 3... on X axis
                const dataPoints = Array(12).fill(null);
                monthData.forEach(d => {
                    if (d.month < 12) {
                        dataPoints[d.month] = (d.users / initialUsers * 100).toFixed(1);
                    }
                });

                datasets.push({
                    label: `Cohort: ${cohortMonth}`,
                    data: dataPoints,
                    borderColor: colors[colorIdx % colors.length],
                    backgroundColor: colors[colorIdx % colors.length],
                    borderWidth: 2,
                    tension: 0.1,
                    spanGaps: true
                });
                colorIdx++;
            });

            new Chart(document.getElementById('retentionChart'), {
                type: 'line',
                data: {
                    labels: ['Month 0', 'Month 1', 'Month 2', 'Month 3', 'Month 4', 'Month 5', 'Month 6', 'Month 7', 'Month 8', 'Month 9', 'Month 10', 'Month 11'],
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'right' },
                        tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.y + '% retention'; } } }
                    },
                    scales: {
                        y: { beginAtZero: true, max: 100, title: { display: true, text: '% Retained' }, grid: { color: '#edf2f7' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    });
</script>

</body>
</html>
